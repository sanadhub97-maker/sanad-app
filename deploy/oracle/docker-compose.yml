# The app behind Caddy, which gets and renews the HTTPS certificate on its own.
services:
  app:
    build:
      context: ../..
      dockerfile: deploy/oracle/Dockerfile
    env_file: .env
    environment:
      CLIENT_URL: https://${SITE_HOST}
    restart: unless-stopped
    shm_size: "256mb"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_HOST: ${SITE_HOST}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  caddy_data:
  caddy_config:
