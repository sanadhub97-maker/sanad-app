name: Security and build checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: security_fixture
          POSTGRES_PASSWORD: isolated_fixture_password
          POSTGRES_DB: sanad_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run test:build-security
      - run: npm audit --audit-level=low
      - run: npx prisma generate --config=server/prisma.config.ts
      - run: npm test --workspace server
      - run: npm test --workspace client
      - run: npm run build:server
      - run: npm run build:client
      - run: node scripts/security-integration.cjs
        env:
          SECURITY_TEST_DATABASE_URL: postgresql://security_fixture:isolated_fixture_password@localhost:5432/sanad_test?sslmode=disable
