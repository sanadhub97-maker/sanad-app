name: Daily wake-up for expiration alerts

# Render's free tier puts the server to sleep when idle, and a sleeping server
# can't run its daily expiration scan. Waking it once a day lets its on-boot
# catch-up run the scan (a no-op if the scan already ran today).
on:
  schedule:
    - cron: "5 6 * * *" # 06:05 UTC = 09:05 Riyadh
  workflow_dispatch:

jobs:
  wake:
    runs-on: ubuntu-latest
    steps:
      - name: Wake the Render service
        run: |
          curl -fsS --retry 6 --retry-delay 20 --retry-all-errors --max-time 120 \
            https://sanad-app-t7ja.onrender.com/api/health
