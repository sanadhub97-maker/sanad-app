name: Keep the server awake

# Render's free tier puts the server to sleep after ~15 idle minutes, and the
# next visitor then waits 30–60s for it to start. Pinging it every 10 minutes
# keeps it awake (the free 750 instance-hours/month cover one service 24/7).
# Waking also lets the server's on-boot catch-up run the daily expiration scan.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the Render service
        run: |
          curl -fsS --retry 6 --retry-delay 20 --retry-all-errors --max-time 120 \
            https://sanad-app-t7ja.onrender.com/api/health
