services:
  - type: web
    name: sanad-app
    runtime: node
    plan: free
    region: ohio
    buildCommand: npm install --include=dev && npm exec -w server -- puppeteer browsers install chrome && npx prisma generate --schema=server/prisma/schema.prisma && npm run build:client && npm run build:server
    startCommand: npx prisma migrate deploy --schema=server/prisma/schema.prisma && node server/dist/index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: CLIENT_URL
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: SETTINGS_ENCRYPTION_KEY
        generateValue: true
      - key: STORAGE_DRIVER
        value: s3
      - key: STORAGE_ENDPOINT
        sync: false
      - key: STORAGE_REGION
        sync: false
      - key: STORAGE_ACCESS_KEY
        sync: false
      - key: STORAGE_SECRET_KEY
        sync: false
      - key: STORAGE_BUCKET
        sync: false
