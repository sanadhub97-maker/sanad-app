<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Cairo:wght@400;500;600;700;800;900&family=Tajawal:wght@400;500;700;800&family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <title>SanaD | نظام SanaD لإدارة الوثائق والموظفين</title>
    <script>
      (function() {
        try {
          // 1. Direction and Language sync
          var savedLang = localStorage.getItem('i18nextLng') || navigator.language || 'ar';
          var isRtl = !savedLang || savedLang.indexOf('en') !== 0;
          document.documentElement.dir = isRtl ? 'rtl' : 'ltr';
          document.documentElement.lang = isRtl ? 'ar' : 'en';

          // 2. Theme Mode - Default to Dark Luxury Obsidian Glass
          var themeMigrated = localStorage.getItem('sanad-theme-luxury-v2');
          if (!themeMigrated) {
            localStorage.setItem('sanad-theme-luxury-v2', 'true');
            try {
              var raw = localStorage.getItem('sanad-ui-preferences');
              if (raw) {
                var parsed = JSON.parse(raw);
                if (parsed && parsed.state) {
                  parsed.state.themeMode = 'dark';
                  localStorage.setItem('sanad-ui-preferences', JSON.stringify(parsed));
                }
              }
            } catch (e) {}
            document.documentElement.classList.add('dark');
          } else {
            var raw = localStorage.getItem('sanad-ui-preferences');
            var mode = 'dark';
            if (raw) {
              try {
                var parsed = JSON.parse(raw);
                if (parsed && parsed.state && parsed.state.themeMode) {
                  mode = parsed.state.themeMode;
                }
              } catch (err) {}
            }
            if (mode !== 'light') {
              document.documentElement.classList.add('dark');
            } else {
              document.documentElement.classList.remove('dark');
            }
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
